default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  database: <%= ENV.fetch("DB_NAME", "ott_agent_#{Rails.env}") %>
  username: <%= ENV.fetch("DB_USERNAME", "ott_agent") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>

development:
  <<: *default

test:
  <<: *default
  database: ott_agent_test

production:
  <<: *default
